<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Sandbox</title>
  <style>
    :root { --bg: #070914; --card: #10152b; --border: #24305a; --text: #e8f4ff; --muted: #9fb3cc; --accent: #5cc8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 30% 0%, #1b1f45, var(--bg) 60%); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 32px 16px; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 34px; margin: 0 0 6px; }
    p.lead { color: var(--muted); margin: 0 0 28px; font-size: 17px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px; transition: transform .15s, border-color .15s; }
    a.card:hover, a.card:focus { transform: translateY(-3px); border-color: var(--accent); }
    .icon { font-size: 40px; }
    .card h2 { margin: 10px 0 6px; font-size: 22px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.45; }
    .tag { display: inline-block; margin-top: 12px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: #1d2a52; color: var(--accent); }
    .soon { opacity: .45; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <h1>🥽 VR Sandbox</h1>
    <p class="lead">Symulatory WebXR do testowania na Meta Quest 3/3S — działają w przeglądarce, bez instalowania.</p>
    <div class="grid">
      <a class="card" href="sims/energy-ball/">
        <div class="icon">⚡</div>
        <h2>Kula Energii</h2>
        <p>Kanion: kule energii, aura i formy mocy, latanie, rywal do walki wręcz, kratery i wgniecenia w skałach.</p>
        <span class="tag">kontrolery / dłonie</span>
      </a>
      <div class="card soon">
        <div class="icon">➕</div>
        <h2>Następny symulator</h2>
        <p>Wkrótce…</p>
      </div>
    </div>
  </main>
</body>
</html>
